<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="road" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#38BDF8" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Perspective 3-Lane Road -->
  <polygon points="120,512 216,210 296,210 392,512" fill="url(#road)"/>
  
  <!-- Road Edge Glow -->
  <line x1="120" y1="512" x2="216" y2="210" stroke="#06B6D4" stroke-width="8"/>
  <line x1="392" y1="512" x2="296" y2="210" stroke="#06B6D4" stroke-width="8"/>
  
  <!-- Dashed Lane Dividers -->
  <line x1="210" y1="512" x2="242" y2="210" stroke="#FFFFFF" stroke-width="4" stroke-dasharray="24 16"/>
  <line x1="302" y1="512" x2="270" y2="210" stroke="#FFFFFF" stroke-width="4" stroke-dasharray="24 16"/>

  <!-- Golden Coin -->
  <circle cx="256" cy="180" r="38" fill="#F59E0B"/>
  <circle cx="256" cy="180" r="30" fill="#FCD34D"/>
  <polygon points="256,155 264,172 282,174 268,187 272,205 256,195 240,205 244,187 230,174 248,172" fill="#B45309"/>

  <!-- Stylized Speed Runner Silhouette -->
  <!-- Torso & Head -->
  <circle cx="256" cy="275" r="24" fill="#E2E8F0"/>
  <path d="M232,295 Q256,290 280,295 L274,370 L238,370 Z" fill="url(#accent)"/>

  <!-- Visor -->
  <rect x="242" y="270" width="28" height="8" rx="4" fill="#06B6D4"/>

  <!-- Fast Motion Speed Lines -->
  <line x1="90" y1="170" x2="160" y2="170" stroke="#38BDF8" stroke-width="6" stroke-linecap="round"/>
  <line x1="60" y1="210" x2="140" y2="210" stroke="#06B6D4" stroke-width="4" stroke-linecap="round"/>
  <line x1="352" y1="160" x2="422" y2="160" stroke="#F59E0B" stroke-width="6" stroke-linecap="round"/>
  <line x1="372" y1="200" x2="452" y2="200" stroke="#FBBF24" stroke-width="4" stroke-linecap="round"/>

  <!-- Lightning Bolt Emblem -->
  <polygon points="256,410 274,380 258,380 270,350 242,385 254,385" fill="#FBBF24"/>
</svg>
